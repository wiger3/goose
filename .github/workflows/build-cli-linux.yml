on:
  workflow_dispatch:
    inputs:
      package_desktop:
        description: 'Also package Linux desktop artifacts; CLI artifacts are always included'
        required: false
        default: false
        type: boolean
      architecture:
        description: 'CPU architecture'
        required: false
        default: all
        type: choice
        options:
          - all
          - x86_64
          - aarch64
      libc:
        description: 'C library'
        required: false
        default: all
        type: choice
        options:
          - all
          - gnu
          - musl
      variant:
        description: 'Build variant; vulkan enables local GPU inference'
        required: false
        default: all
        type: choice
        options:
          - all
          - standard
          - vulkan
  workflow_call:
    inputs:
      version:
        required: false
        default: ""
        type: string
      ref:
        type: string
        required: false
        default: ""
      package_desktop:
        description: 'Also package Linux desktop artifacts; CLI artifacts are always included'
        required: false
        default: false
        type: boolean
      architecture:
        description: 'x86_64, aarch64, or all'
        required: false
        default: all
        type: string
      libc:
        description: 'gnu, musl, or all'
        required: false
        default: all
        type: string
      variant:
        description: 'standard, vulkan, or all'
        required: false
        default: all
        type: string

name: "Build CLI and optionally Desktop for Linux"

permissions:
  contents: read

jobs:
  select-targets:
    name: Select targets
    runs-on: ubuntu-22.04
    outputs:
      cli_matrix: ${{ steps.filter.outputs.cli_matrix }}
      desktop_matrix: ${{ steps.filter.outputs.desktop_matrix }}
      desktop_count: ${{ steps.filter.outputs.desktop_count }}
    steps:
      - name: Filter the build matrices
        id: filter
        env:
          ARCH: ${{ inputs.architecture || 'all' }}
          LIBC: ${{ inputs.libc || 'all' }}
          VARIANT: ${{ inputs.variant || 'all' }}
          PACKAGE_DESKTOP: ${{ inputs.package_desktop }}
        run: |
          set -euo pipefail

          CLI='[
            {"architecture":"x86_64","target-suffix":"unknown-linux-gnu","libc":"gnu","variant":"standard","build-on":"ubuntu-22.04","container":"quay.io/pypa/manylinux_2_28_x86_64@sha256:441c35fdc6ee809ff9260894f8468ab4fea8c15dc880f8700a3f81b7922c1cda"},
            {"architecture":"aarch64","target-suffix":"unknown-linux-gnu","libc":"gnu","variant":"standard","build-on":"ubuntu-22.04-arm","container":"quay.io/pypa/manylinux_2_28_aarch64@sha256:8b5f2b4e8c072ae5aefeb659f22c03e1ff46e6a82f154b6c904b106c87e65ff7"},
            {"architecture":"x86_64","target-suffix":"unknown-linux-musl","libc":"musl","variant":"musl","build-on":"ubuntu-22.04","container":""},
            {"architecture":"aarch64","target-suffix":"unknown-linux-musl","libc":"musl","variant":"musl","build-on":"ubuntu-22.04-arm","container":""},
            {"architecture":"x86_64","target-suffix":"unknown-linux-gnu","libc":"gnu","variant":"vulkan","build-on":"ubuntu-24.04","container":""},
            {"architecture":"aarch64","target-suffix":"unknown-linux-gnu","libc":"gnu","variant":"vulkan","build-on":"ubuntu-24.04-arm","container":""}
          ]'

          DESKTOP='[
            {"architecture":"x86_64","target":"x86_64-unknown-linux-gnu","libc":"gnu","electron_arch":"x64","flatpak_arch":"x86_64","variant":"standard","variant_suffix":"","build_on":"ubuntu-22.04"},
            {"architecture":"aarch64","target":"aarch64-unknown-linux-gnu","libc":"gnu","electron_arch":"arm64","flatpak_arch":"aarch64","variant":"standard","variant_suffix":"","build_on":"ubuntu-22.04-arm"},
            {"architecture":"x86_64","target":"x86_64-unknown-linux-gnu","libc":"gnu","electron_arch":"x64","flatpak_arch":"x86_64","variant":"vulkan","variant_suffix":"-vulkan","build_on":"ubuntu-24.04"},
            {"architecture":"aarch64","target":"aarch64-unknown-linux-gnu","libc":"gnu","electron_arch":"arm64","flatpak_arch":"aarch64","variant":"vulkan","variant_suffix":"-vulkan","build_on":"ubuntu-24.04-arm"}
          ]'

          filter() {
            jq -c --arg arch "$ARCH" --arg libc "$LIBC" --arg variant "$VARIANT" '
              [ .[] | select(
                  ($arch == "all" or .architecture == $arch)
                  and ($libc == "all" or .libc == $libc)
                  and (
                    $variant == "all"
                    or .variant == $variant
                    or (.variant == "musl" and $variant == "standard")
                  )
                ) ]'
          }

          CLI_MATRIX=$(printf '%s' "$CLI" | filter)
          DESKTOP_MATRIX=$(printf '%s' "$DESKTOP" | filter)
          CLI_COUNT=$(printf '%s' "$CLI_MATRIX" | jq 'length')
          DESKTOP_COUNT=$(printf '%s' "$DESKTOP_MATRIX" | jq 'length')

          if [ "$CLI_COUNT" -eq 0 ]; then
            echo "::error::No Linux target matches architecture=$ARCH libc=$LIBC variant=$VARIANT"
            exit 1
          fi

          # GitHub rejects an empty matrix, so keep a placeholder entry and let the
          # job-level `if` skip it (e.g. musl + package_desktop has no desktop build).
          if [ "$DESKTOP_COUNT" -eq 0 ]; then
            DESKTOP_MATRIX=$(printf '%s' "$DESKTOP_MATRIX" | jq -c '. + [{"architecture":"none","target":"none","libc":"none","electron_arch":"x64","flatpak_arch":"x86_64","variant":"none","variant_suffix":"","build_on":"ubuntu-22.04"}]')
          fi

          {
            echo "cli_matrix=$(printf '%s' "$CLI_MATRIX" | jq -c '{include: .}')"
            echo "desktop_matrix=$(printf '%s' "$DESKTOP_MATRIX" | jq -c '{include: .}')"
            echo "desktop_count=$DESKTOP_COUNT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Selected Linux targets"
            echo ""
            echo "architecture=\`$ARCH\`, libc=\`$LIBC\`, variant=\`$VARIANT\`, package_desktop=\`$PACKAGE_DESKTOP\`"
            echo ""
            echo "| architecture | target | variant |"
            echo "| --- | --- | --- |"
            printf '%s' "$CLI_MATRIX" | jq -r '.[] | "| \(.architecture) | \(."target-suffix") | \(.variant) |"'
          } >> "$GITHUB_STEP_SUMMARY"

  build-cli-linux:
    name: Build Goose (Linux, ${{ matrix.architecture }}, ${{ matrix.variant }})
    needs: select-targets
    runs-on: ${{ matrix.build-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.cli_matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Update version in Cargo.toml
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/set-cargo-version.sh "$VERSION"

      - name: Install Linux build dependencies (host runner)
        if: matrix.container == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libxcb1-dev

          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            sudo apt-get install -y \
              libvulkan-dev \
              libvulkan1 \
              glslc
          fi

          if [ "${{ matrix.variant }}" = "musl" ]; then
            sudo apt-get install -y musl-tools
          fi

      - name: Install Linux build dependencies (manylinux container)
        if: matrix.container != ''
        run: |
          # perl-core provides FindBin, File::Compare, etc. that openssl-sys's
          # vendored openssl build needs; in AlmaLinux 8 these aren't standalone packages.
          # clang provides libclang.so for bindgen (used by llama-cpp-sys-2).
          # Defensive: avoid actions/checkout falling back to a tarball download if base image changes.
          dnf install -y --setopt=install_weak_deps=False \
            openssl-devel \
            dbus-devel \
            libxcb-devel \
            cmake \
            perl-core \
            clang \
            git \
            tar

      - name: Bootstrap Rust toolchain (manylinux container)
        if: matrix.container != ''
        env:
          TARGET: ${{ matrix.architecture }}-${{ matrix.target-suffix }}
        run: |
          # Hermit's tool cache is host-runner-scoped; inside the container we
          # bootstrap rustup directly and let rust-toolchain.toml pin the channel.
          # This must run before the cache step: Swatinem/rust-cache shells out to
          # `rustc -vV` and silently restores and saves nothing when rustc is missing.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          RUST_CHANNEL=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
          if [ -z "$RUST_CHANNEL" ]; then
            echo "Could not parse channel from rust-toolchain.toml" >&2
            exit 1
          fi
          rustup toolchain install "$RUST_CHANNEL" --profile minimal \
            --component rustc,cargo --target "$TARGET"
          rustup show

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ${{ matrix.architecture }}-${{ matrix.target-suffix }}-${{ matrix.build-on }}-${{ matrix.container || 'native' }}
          # A release `target/` for this workspace is on the order of 2 GB and the
          # repository cache budget is 10 GB, so caching one per matrix entry makes
          # the entries evict each other. sccache below caches per crate instead,
          # shared by every target, so only the registry is cached here.
          cache-targets: false
          cache-on-failure: true

      - name: Set up sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Enable sccache
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build CLI (host runner)
        if: matrix.container == ''
        env:
          RUST_LOG: debug
          RUST_BACKTRACE: 1
        run: |
          source ./bin/activate-hermit
          export TARGET="${{ matrix.architecture }}-${{ matrix.target-suffix }}"
          rustup target add "${TARGET}"
          echo "Building for target: ${TARGET}"
          echo "Rust toolchain info:"
          rustup show

          FEATURE_ARGS=()
          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            FEATURE_ARGS=(--features vulkan)
          fi

          if [ "${{ matrix.variant }}" = "musl" ]; then
            cargo build --release --target ${TARGET} -p goose-cli --bin goose \
              --no-default-features \
              --features portable-default
          else
            cargo build --release --target ${TARGET} -p goose-cli --bin goose "${FEATURE_ARGS[@]}"
          fi

      - name: Build CLI (manylinux container)
        if: matrix.container != ''
        env:
          RUST_BACKTRACE: 1
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          TARGET="${{ matrix.architecture }}-${{ matrix.target-suffix }}"
          cargo build --release --target "$TARGET" -p goose-cli --bin goose

      - name: Package CLI
        run: |
          # Hermit isn't installed in the manylinux container; tar is all this step needs.
          if [ "${{ matrix.container }}" = '' ]; then
            source ./bin/activate-hermit
          fi
          export TARGET="${{ matrix.architecture }}-${{ matrix.target-suffix }}"
          export VARIANT_SUFFIX=""
          if [ "${{ matrix.variant }}" = "vulkan" ]; then
            VARIANT_SUFFIX="-vulkan"
          fi

          # Create a directory for the package contents
          mkdir -p "target/${TARGET}/release/goose-package"

          # Copy the goose binary
          cp "target/${TARGET}/release/goose" "target/${TARGET}/release/goose-package/"

          cd "target/${TARGET}/release"
          tar -czf "goose-${TARGET}${VARIANT_SUFFIX}.tar.gz" -C goose-package .
          echo "ARTIFACT_GZ=target/${TARGET}/release/goose-${TARGET}${VARIANT_SUFFIX}.tar.gz" >> $GITHUB_ENV

      - name: Upload CLI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: goose-${{ matrix.architecture }}-${{ matrix.target-suffix }}${{ matrix.variant != 'standard' && matrix.variant != 'musl' && format('-{0}', matrix.variant) || '' }}
          path: ${{ env.ARTIFACT_GZ }}

      - name: Prepare internal Goose binary
        if: ${{ inputs.package_desktop && matrix.target-suffix == 'unknown-linux-gnu' }}
        env:
          TARGET: ${{ matrix.architecture }}-${{ matrix.target-suffix }}
          VARIANT_SUFFIX: ${{ matrix.variant == 'vulkan' && '-vulkan' || '' }}
        run: |
          mkdir -p artifacts
          cp "target/${TARGET}/release/goose" "artifacts/internal-goose-${TARGET}${VARIANT_SUFFIX}"

      - name: Upload internal Goose binary
        if: ${{ inputs.package_desktop && matrix.target-suffix == 'unknown-linux-gnu' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: internal-goose-${{ matrix.architecture }}-${{ matrix.target-suffix }}${{ matrix.variant == 'vulkan' && '-vulkan' || '' }}
          path: artifacts/internal-goose-${{ matrix.architecture }}-${{ matrix.target-suffix }}${{ matrix.variant == 'vulkan' && '-vulkan' || '' }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  package-desktop-linux:
    name: Package Desktop (Linux, ${{ matrix.electron_arch }}, ${{ matrix.variant }})
    if: ${{ inputs.package_desktop && needs.select-targets.outputs.desktop_count != '0' }}
    needs: [select-targets, build-cli-linux]
    runs-on: ${{ matrix.build_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.desktop_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Update desktop version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          npm pkg set "version=${VERSION}"

      - name: Debug workflow info
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          echo "=== Workflow Information ==="
          echo "Workflow: ${WORKFLOW_NAME}"
          echo "Ref: ${WORKFLOW_REF}"
          echo "Event: ${EVENT_NAME}"
          echo "Repo: ${REPOSITORY}"
          echo "Target: ${TARGET}"
          echo "Variant: ${VARIANT}"
          echo ""
          echo "=== System Information ==="
          uname -a
          lsb_release -a || true
          df -h

      - name: Install system dependencies
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libnss3-dev \
            libatk-bridge2.0-dev \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            rpm \
            fakeroot \
            dpkg-dev \
            protobuf-compiler \
            flatpak \
            flatpak-builder \
            elfutils

          if [ "${VARIANT}" = "vulkan" ]; then
            sudo apt-get install -y \
              libasound2t64 \
              libvulkan-dev \
              libvulkan1 \
              glslc
          else
            sudo apt-get install -y libasound2
          fi

      - name: Configure RPM packaging
        run: |
          echo '%_build_id_links none' > ~/.rpmmacros
          test "$(rpm --eval '%{_build_id_links}')" = "none"

      - name: Setup Flatpak runtimes
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Download internal Goose binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: internal-goose-${{ matrix.target }}${{ matrix.variant_suffix }}
          path: backend

      - name: Prepare desktop backend
        env:
          INTERNAL_BINARY: internal-goose-${{ matrix.target }}${{ matrix.variant_suffix }}
        run: |
          mkdir -p ui/desktop/src/bin
          rm -f ui/desktop/src/bin/goose
          mv "backend/${INTERNAL_BINARY}" ui/desktop/src/bin/goose
          chmod +x ui/desktop/src/bin/goose
          file ui/desktop/src/bin/goose

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ui/desktop/node_modules
            .hermit/node/cache
          key: linux-pnpm-cache-v1-${{ matrix.electron_arch }}-${{ matrix.variant }}-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            linux-pnpm-cache-v1-${{ matrix.electron_arch }}-${{ matrix.variant }}-${{ runner.os }}-

      - name: Install pnpm dependencies
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          pnpm install --frozen-lockfile

      - name: Build Linux packages
        env:
          ELECTRON_ARCH: ${{ matrix.electron_arch }}
          FLATPAK_ARCH: ${{ matrix.flatpak_arch }}
          GOOSE_DESKTOP_LINUX_VARIANT: ${{ matrix.variant }}
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          pnpm run make --platform=linux --arch="${ELECTRON_ARCH}"

          if [ "${GOOSE_DESKTOP_LINUX_VARIANT}" = "vulkan" ]; then
            for package in \
              "out/make/deb/${ELECTRON_ARCH}/"*.deb \
              "out/make/rpm/${ELECTRON_ARCH}/"*.rpm \
              "out/make/flatpak/${FLATPAK_ARCH}/"*.flatpak; do
              [ -e "${package}" ] || continue
              extension="${package##*.}"
              base="${package%.*}"
              mv "${package}" "${base}-vulkan.${extension}"
            done
          fi

          for package in "out/make/rpm/${ELECTRON_ARCH}/"*.rpm; do
            package_contents="$(rpm -qlp "${package}")"
            if grep -qE '^/usr/lib/\.build-id(/|$)' <<< "${package_contents}"; then
              echo "::error file=${package}::RPM contains build-id links"
              exit 1
            fi
          done

          find out/ -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.flatpak" \) -exec ls -lh {} \;

      - name: Upload .deb package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Goose-linux-${{ matrix.electron_arch }}${{ matrix.variant_suffix }}-deb
          path: ui/desktop/out/make/deb/${{ matrix.electron_arch }}/*${{ matrix.variant_suffix }}.deb
          if-no-files-found: error

      - name: Upload .rpm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Goose-linux-${{ matrix.electron_arch }}${{ matrix.variant_suffix }}-rpm
          path: ui/desktop/out/make/rpm/${{ matrix.electron_arch }}/*${{ matrix.variant_suffix }}.rpm
          if-no-files-found: error

      - name: Upload .flatpak package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Goose-linux-${{ matrix.electron_arch }}${{ matrix.variant_suffix }}-flatpak
          path: ui/desktop/out/make/flatpak/${{ matrix.flatpak_arch }}/*${{ matrix.variant_suffix }}.flatpak
          if-no-files-found: error
